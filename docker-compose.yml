# Study Planner: Docker Compose
# Run everything:  docker compose up --build      (app: http://localhost:8080, phpMyAdmin: http://localhost:8081)
# Containers: db (MySQL), backend (Spring Boot: REST API + static frontend), phpmyadmin.
# Secrets come from .env (copy .env.example to .env). Never commit .env.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-studyplanner}
      MYSQL_USER: ${DB_USER:-studyplanner}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"   # only reachable from this machine (only needed to run the backend with mvnw)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: studyplanner-backend
    restart: unless-stopped
    environment:
      DB_HOST: db                # the MySQL service name, never localhost
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-studyplanner}
      DB_USER: ${DB_USER:-studyplanner}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_SAMPLE_DATA: ${APP_SAMPLE_DATA:-true}
      # Sample data dates use "today" of the backend: use Thai time for the OS and the JVM.
      TZ: Asia/Bangkok
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Bangkok
    ports:
      - "127.0.0.1:8080:8080"   # http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login.html"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:8081:80"     # http://localhost:8081
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
