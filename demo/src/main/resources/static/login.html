<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Study Planner</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <div class="auth__wrap">
      <div class="auth__brand">
        <span class="logo-tile logo-tile--lg"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><mask id="logo-auth"><rect width="24" height="24" fill="#fff" stroke="none"></rect><circle cx="18" cy="18" r="5.2" fill="#000" stroke="none"></circle></mask><g mask="url(#logo-auth)"><path d="M8.5 4H6.5a2 2 0 0 0-2 2v13.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"></path><rect x="8.5" y="2.5" width="6" height="3" rx="1"></rect><rect x="7.25" y="7.25" width="2.5" height="2.5" rx=".5"></rect><rect x="7.25" y="11.25" width="2.5" height="2.5" rx=".5"></rect><rect x="7.25" y="15.25" width="2.5" height="2.5" rx=".5"></rect><path d="M12 8.5h3.5M12 12.5h3.5M12 16.5h.8"></path></g><circle cx="18" cy="18" r="3.9"></circle><path d="M18 16v2.1l1.3 1.1"></path></svg></span>
        <div class="auth__name">Study Planner</div>
        <div class="auth__tagline">Courses, deadlines and grades in one place.</div>
      </div>

      <section class="auth__card">
        <div class="segmented" role="tablist" aria-label="Log in or register">
          <button type="button" role="tab" class="segmented__btn" id="tab-login" data-mode="login" aria-controls="auth-form" aria-selected="true">Log in</button>
          <button type="button" role="tab" class="segmented__btn" id="tab-register" data-mode="register" aria-controls="auth-form" aria-selected="false" tabindex="-1">Register</button>
        </div>

        <div class="auth__heading">
          <h1 class="auth__title" id="auth-title">Welcome back</h1>
          <p class="auth__sub" id="auth-sub">Log in to see your courses and deadlines.</p>
        </div>

        <form class="auth__form" id="auth-form" role="tabpanel" aria-labelledby="auth-title" novalidate>
          <label class="field" data-only="register" hidden>Full name
            <input class="input" name="name" type="text" placeholder="Mia Johnson" autocomplete="name">
            <span class="field__error" data-error-for="name"></span>
          </label>

          <label class="field">Email
            <input class="input" name="email" type="email" placeholder="you@university.edu" autocomplete="email">
            <span class="field__error" data-error-for="email"></span>
          </label>

          <div class="field">
            <span class="field__row">
              <label for="auth-password">Password</label>
              <button type="button" class="link-btn auth__forgot" id="forgot" data-only="login">Forgot password?</button>
            </span>
            <input class="input" id="auth-password" name="password" type="password" placeholder="Your password" autocomplete="current-password">
            <span class="field__error" data-error-for="password"></span>
          </div>

          <label class="field" data-only="register" hidden>Confirm password
            <input class="input" name="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password">
            <span class="field__error" data-error-for="confirm"></span>
          </label>

          <button type="submit" class="btn btn-primary auth__submit" id="auth-submit">Log in</button>
        </form>

        <p class="auth__switch">
          <span id="switch-text">Don’t have an account?</span>
          <button type="button" class="link-btn" id="switch-link">Register</button>
        </p>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
