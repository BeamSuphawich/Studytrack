spring.application.name=studyplanner

# ---------- Database (MySQL) ----------
# All values come from environment variables. The password has NO default on purpose.
# DB_HOST defaults to "db" (the Docker Compose service). When running with mvnw on
# your machine, set DB_HOST=localhost.
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:studyplanner}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USER:studyplanner}
spring.datasource.password=${DB_PASSWORD}

# Tables are created by src/main/resources/schema.sql (CREATE TABLE IF NOT EXISTS).
# Hibernate only checks that the entities match them; it never changes the schema.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Session cookie ----------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# ---------- App ----------
# Create sample courses, tasks and grades for every new account.
app.sample-data=${APP_SAMPLE_DATA:true}
